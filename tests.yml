name: Tests

# Corre los tests en cada cambio. Si algo falla, GitHub lo marca en rojo antes de publicar.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
